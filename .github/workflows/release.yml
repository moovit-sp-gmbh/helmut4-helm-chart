name: Release Helm Chart

on:
  push:
    tags:
      - '**'                      # any tag — `v*` semver or named tags like `beta`/`rc1`
      - '!client-autologin-v*'    # except the init image's own tags, which ship no chart

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for release notes

      - name: Install Helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Helm dependencies
        run: helm dependency update ./helmut4

      - name: Lint chart
        run: helm lint ./helmut4 --strict

      - name: Package chart
        run: helm package ./helmut4 --destination /tmp/chart-pkg

      - name: Resolve previous tag
        id: prev_tag
        run: |
          # Nearest tag by ancestry, not by date: a tag created later on an
          # unrelated line (the init image's, say) is not this chart's predecessor.
          PREV=$(git describe --tags --abbrev=0 \
                   --exclude='client-autologin-v*' \
                   "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous chart tag: ${PREV:-<none>}"

      - name: Build release notes from commits
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="${{ steps.prev_tag.outputs.prev }}"
          CHART_VERSION=$(grep '^version:' helmut4/Chart.yaml | awk '{print $2}')
          APP_VERSION=$(grep '^appVersion:' helmut4/Chart.yaml | awk '{print $2}' | tr -d '"')

          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          # `chore(release): x.y.z` is bookkeeping — nobody wants it in x.y.z's notes.
          NOTES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges \
                  | grep -vE '^- chore\(release\)' || true)

          # Group by conventional commit type. Anything with a `!` marker or a
          # BREAKING CHANGE footer is called out first.
          BREAKING=$(git log "$RANGE" --no-merges \
                       --pretty=format:"- %s (%h)%n%b" \
                     | grep -E '^- [a-z]+(\([^)]*\))?!:|BREAKING CHANGE' || true)
          FEATURES=$(echo "$NOTES" | grep -E '^- feat'                  || true)
          FIXES=$(echo "$NOTES"    | grep -E '^- (fix|perf)'            || true)
          DOCS=$(echo "$NOTES"     | grep -E '^- docs'                  || true)
          MAINT=$(echo "$NOTES"    | grep -E '^- (ci|build|chore|refactor|style|test|revert)' || true)
          OTHER=$(echo "$NOTES"    | grep -vE '^- (feat|fix|perf|docs|ci|build|chore|refactor|style|test|revert)' || true)

          BODY="Chart \`${CHART_VERSION}\` · Helmut4 \`${APP_VERSION}\`\n\n"
          BODY="${BODY}\`\`\`bash\nhelm repo add helmut4 https://moovit-sp-gmbh.github.io/helmut4-helm-chart\nhelm upgrade helmut4 helmut4/helmut4 --install -n helmut4 --version ${CHART_VERSION}\n\`\`\`\n\n"

          # A commit list says what was touched, not what the release does. Drop a
          # prose summary at .github/release-notes/<tag>.md and it leads the notes.
          if [ -f ".github/release-notes/${TAG}.md" ]; then
            BODY="${BODY}$(sed 's/\\/\\\\/g' ".github/release-notes/${TAG}.md")\n\n---\n\n"
          fi

          [ -n "$BREAKING" ] && BODY="${BODY}## ⚠️ Breaking Changes\n${BREAKING}\n\n"
          [ -n "$FEATURES" ] && BODY="${BODY}## ✨ Features\n${FEATURES}\n\n"
          [ -n "$FIXES"    ] && BODY="${BODY}## 🐛 Fixes & Performance\n${FIXES}\n\n"
          [ -n "$DOCS"     ] && BODY="${BODY}## 📚 Documentation\n${DOCS}\n\n"
          [ -n "$MAINT"    ] && BODY="${BODY}## 🔧 Maintenance\n${MAINT}\n\n"
          [ -n "$OTHER"    ] && BODY="${BODY}## Other Changes\n${OTHER}\n\n"

          if [ -n "$PREV" ]; then
            BODY="${BODY}**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}\n"
          fi

          printf "%b" "$BODY" > /tmp/release_notes.md
          cat /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Detect prerelease
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Treat anything that isn't a clean vN.N.N tag as a prerelease
          if echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          CHART_PKG=$(ls /tmp/chart-pkg/helmut4-*.tgz)
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            ${{ steps.prerelease.outputs.flag }} \
            "$CHART_PKG"
