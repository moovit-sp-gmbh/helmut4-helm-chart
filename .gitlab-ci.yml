---
# GitLab CI/CD pipeline for the Helmut4 Helm chart
#
# Uses Docker-in-Docker (dind): every tool (helm, kubeconform, kube-score,
# checkov, yamllint) runs via "docker run" - nothing needs to be installed
# on the GitLab runner host.
#
# Runner requirements - register the runner once with Docker executor + privileged:
#   gitlab-runner register \
#     --executor docker \
#     --docker-image docker:26 \
#     --docker-privileged
#
# Stages:
#   lint     - YAML syntax + Helm lint
#   validate - Render templates and validate against Kubernetes schemas
#   security - Security and best-practice checks (allow_failure: true)
#   package  - Package and push to OCI registry (on tags)

stages:
  - lint
  - validate
  - security
  - package

# ---------------------------------------------------------------------------
# Global defaults: every job runs inside docker:26, dind as a sidecar service.
# ---------------------------------------------------------------------------
default:
  image: docker:26
  services:
    - name: docker:26-dind
      alias: docker
  before_script:
    - docker info   # sanity-check that dind is reachable

variables:
  # dind TLS (required for docker:26-dind)
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

  # Tool images - pin versions for reproducibility
  HELM_IMAGE: "alpine/helm:3.14.0"
  KUBECONFORM_IMAGE: "ghcr.io/yannh/kubeconform:v0.6.4-alpine"
  KUBE_SCORE_IMAGE: "zegl/kube-score:v1.19.0"
  CHECKOV_IMAGE: "bridgecrew/checkov:3"
  YAMLLINT_IMAGE: "cytopia/yamllint:1"

  CHART_DIR: "./helmut4"

  # Define these in GitLab: Settings -> CI/CD -> Variables
  #   HELM_REGISTRY_URL   - OCI registry, e.g. registry.gitlab.com/yourgroup
  #   HELM_REGISTRY_USER  - registry username
  #   HELM_REGISTRY_PASS  - registry password / project token (masked)

# ---------------------------------------------------------------------------
# Stage: lint
# ---------------------------------------------------------------------------

yaml-lint:
  stage: lint
  script:
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/workspace" -w /workspace \
        "$YAMLLINT_IMAGE" \
        yamllint -d '{extends: default, rules: {line-length: {max: 160}, truthy: {allowed-values: ["true","false","yes","no"]}}}' \
          helmut4/values.yaml helmut4/Chart.yaml examples/

helm-lint:
  stage: lint
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm dependency build "$CHART_DIR"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm lint "$CHART_DIR" --strict
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm lint "$CHART_DIR" -f examples/values-production.yaml --strict
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm lint "$CHART_DIR" -f examples/values-development.yaml --strict
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm lint "$CHART_DIR" -f examples/values-aws-csi.yaml --strict
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm lint "$CHART_DIR" -f examples/values-azure-csi.yaml --strict

# ---------------------------------------------------------------------------
# Stage: validate
# ---------------------------------------------------------------------------

helm-template:
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm dependency build "$CHART_DIR"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" sh -c "helm template helmut4 $CHART_DIR > /workspace/rendered-default.yaml"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" sh -c "helm template helmut4 $CHART_DIR -f examples/values-production.yaml > /workspace/rendered-production.yaml"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" sh -c "helm template helmut4 $CHART_DIR -f examples/values-development.yaml > /workspace/rendered-development.yaml"
  artifacts:
    paths:
      - rendered-*.yaml
    expire_in: 1 hour

kubeconform:
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm dependency build "$CHART_DIR"
    # Render to file first, then validate (avoids cross-container pipes)
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" sh -c "helm template helmut4 $CHART_DIR -f examples/values-production.yaml > /workspace/rendered-prod.yaml"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$KUBECONFORM_IMAGE" -strict -ignore-missing-schemas -kubernetes-version 1.28.0 -summary /workspace/rendered-prod.yaml
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" sh -c "helm template helmut4 $CHART_DIR -f examples/values-development.yaml > /workspace/rendered-dev.yaml"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$KUBECONFORM_IMAGE" -strict -ignore-missing-schemas -kubernetes-version 1.28.0 -summary /workspace/rendered-dev.yaml

# ---------------------------------------------------------------------------
# Stage: security (informational - allow_failure: true)
# ---------------------------------------------------------------------------

kube-score:
  stage: security
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm dependency build "$CHART_DIR"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" sh -c "helm template helmut4 $CHART_DIR -f examples/values-production.yaml > /workspace/rendered-score.yaml"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$KUBE_SCORE_IMAGE" score --ignore-test pod-probes --ignore-test container-image-tag /workspace/rendered-score.yaml
  allow_failure: true

checkov:
  stage: security
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$CHECKOV_IMAGE" --directory helmut4/templates --framework helm --quiet --compact --skip-check CKV_K8S_8,CKV_K8S_9
  allow_failure: true

# ---------------------------------------------------------------------------
# Stage: package
# ---------------------------------------------------------------------------

package-chart:
  stage: package
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm dependency build "$CHART_DIR"
    - mkdir -p dist
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm package "$CHART_DIR" --destination /workspace/dist
    - ls -la dist/
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 7 days
  rules:
    - if: "$CI_COMMIT_TAG"                  # automatically on version tags
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual                          # manually from main branch

push-to-registry:
  stage: package
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm dependency build "$CHART_DIR"
    - mkdir -p dist
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" helm package "$CHART_DIR" --destination /workspace/dist
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR:/workspace" -w /workspace \
        "$HELM_IMAGE" \
        sh -c "helm registry login $HELM_REGISTRY_URL -u $HELM_REGISTRY_USER -p $HELM_REGISTRY_PASS \
          && for chart in /workspace/dist/*.tgz; do helm push \"\$chart\" oci://$HELM_REGISTRY_URL; done"
  rules:
    - if: "$CI_COMMIT_TAG"                  # tags only
  environment:
    name: helm-registry
  needs:
    - package-chart
