---
# GitLab CI/CD pipeline for the Helmut4 Helm chart
#
# Every tool (helm, kubeconform, kube-score, checkov, yamllint) is invoked
# via "docker run" against the Docker daemon on the runner host.
#
# Runner requirements:
#   - Shell executor (gitlab-runner 13.x+)
#   - Docker installed and running on the runner host
#   - The gitlab-runner user must be in the "docker" group:
#       sudo usermod -aG docker gitlab-runner
#
# Stages:
#   lint     - YAML syntax + Helm lint
#   validate - Render templates and validate against Kubernetes schemas
#   security - Security and best-practice checks (allow_failure: true)
#   package  - Package and push to OCI registry (on tags)

stages:
  - lint
  - validate
  - security
  - package

variables:
  # Tool images - pin versions for reproducibility
  HELM_IMAGE: "alpine/helm:3.14.0"
  KUBECONFORM_IMAGE: "ghcr.io/yannh/kubeconform:v0.6.4-alpine"
  KUBE_SCORE_IMAGE: "zegl/kube-score:v1.19.0"
  CHECKOV_IMAGE: "bridgecrew/checkov:3"
  YAMLLINT_IMAGE: "cytopia/yamllint:1"

  CHART_DIR: "./helmut4"

  # Define these in GitLab: Settings -> CI/CD -> Variables
  #   HELM_REGISTRY_URL   - OCI registry, e.g. registry.gitlab.com/yourgroup
  #   HELM_REGISTRY_USER  - registry username
  #   HELM_REGISTRY_PASS  - registry password / project token (masked)

before_script:
  - docker version # verify Docker is available on the runner host

# ---------------------------------------------------------------------------
# Stage: lint
# ---------------------------------------------------------------------------

yaml-lint:
  stage: lint
  script:
    # .yamllint.yml in the repo root is auto-discovered — no inline -d config needed
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$YAMLLINT_IMAGE" helmut4/values.yaml helmut4/Chart.yaml examples/

helm-lint:
  stage: lint
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" dependency update "$CHART_DIR"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" lint "$CHART_DIR" --strict
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" lint "$CHART_DIR" -f examples/values-production.yaml --strict
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" lint "$CHART_DIR" -f examples/values-development.yaml --strict
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" lint "$CHART_DIR" -f examples/values-aws-csi.yaml --strict
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" lint "$CHART_DIR" -f examples/values-azure-csi.yaml --strict

# ---------------------------------------------------------------------------
# Stage: validate
# ---------------------------------------------------------------------------

helm-template:
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" dependency update "$CHART_DIR"
    - docker run --rm --entrypoint sh -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" -c "helm template helmut4 $CHART_DIR > /workspace/rendered-default.yaml"
    - docker run --rm --entrypoint sh -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" -c "helm template helmut4 $CHART_DIR -f examples/values-production.yaml > /workspace/rendered-production.yaml"
    - docker run --rm --entrypoint sh -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" -c "helm template helmut4 $CHART_DIR -f examples/values-development.yaml > /workspace/rendered-development.yaml"
  artifacts:
    paths:
      - rendered-*.yaml
    expire_in: 1 hour

kubeconform:
  stage: validate
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" dependency update "$CHART_DIR"
    - docker run --rm --entrypoint sh -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" -c "helm template helmut4 $CHART_DIR -f examples/values-production.yaml > /workspace/rendered-prod.yaml"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$KUBECONFORM_IMAGE" -ignore-missing-schemas -kubernetes-version 1.31.0 -summary /workspace/rendered-prod.yaml
    - docker run --rm --entrypoint sh -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" -c "helm template helmut4 $CHART_DIR -f examples/values-development.yaml > /workspace/rendered-dev.yaml"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$KUBECONFORM_IMAGE" -ignore-missing-schemas -kubernetes-version 1.31.0 -summary /workspace/rendered-dev.yaml

# ---------------------------------------------------------------------------
# Stage: security (informational - allow_failure: true)
# ---------------------------------------------------------------------------

kube-score:
  stage: security
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" dependency update "$CHART_DIR"
    - docker run --rm --entrypoint sh -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" -c "helm template helmut4 $CHART_DIR -f examples/values-production.yaml > /workspace/rendered-score.yaml"
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$KUBE_SCORE_IMAGE" score --ignore-test pod-probes --ignore-test container-image-tag /workspace/rendered-score.yaml
  allow_failure: true

checkov:
  stage: security
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$CHECKOV_IMAGE" --directory helmut4/templates --framework helm --quiet --compact --skip-check CKV_K8S_8,CKV_K8S_9
  allow_failure: true

# ---------------------------------------------------------------------------
# Stage: package
# ---------------------------------------------------------------------------

package-chart:
  stage: package
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" dependency update "$CHART_DIR"
    - mkdir -p dist
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" package "$CHART_DIR" --destination /workspace/dist
    - ls -la dist/
  artifacts:
    paths:
      - dist/*.tgz
    expire_in: 7 days
  rules:
    - if: "$CI_COMMIT_TAG" # automatically on version tags
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual # manually from main branch

push-to-registry:
  stage: package
  script:
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" dependency update "$CHART_DIR"
    - mkdir -p dist
    - docker run --rm -v "$CI_PROJECT_DIR:/workspace" -w /workspace "$HELM_IMAGE" package "$CHART_DIR" --destination /workspace/dist
    - |
      docker run --rm --entrypoint sh \
        -v "$CI_PROJECT_DIR:/workspace" -w /workspace \
        "$HELM_IMAGE" \
        -c "helm registry login $HELM_REGISTRY_URL -u $HELM_REGISTRY_USER -p $HELM_REGISTRY_PASS \
          && for chart in /workspace/dist/*.tgz; do helm push \"\$chart\" oci://$HELM_REGISTRY_URL; done"
  rules:
    - if: "$CI_COMMIT_TAG" # tags only
  environment:
    name: helm-registry
  needs:
    - package-chart
