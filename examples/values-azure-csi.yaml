# Example: Azure Disk CSI Driver
# Use for deployments on Azure AKS

global:
  storage:
    csiDriver: "disk.csi.azure.com"
    storageClassName: "helmut4-csi-storage"
    volumes:
      - name: helmut-storage
        mountPath: "/Volumes/Helmut"
        size: "100Gi"
        source: "" # Not used with Azure Disk – dynamic provisioning
        appMount: true

# MongoDB on a dedicated block-storage class (Azure Premium SSD recommended)
mongodb:
  persistence:
    storageClass: "managed-premium" # adjust to your Azure StorageClass
    size: "50Gi"
  auth:
    rootUsername: "root"
    rootPassword: "CHANGE_ME"
  replicaSet:
    enabled: true
    name: "rs0"
    key: "CHANGE_ME_BASE64_6_TO_1024_CHARS"

rabbitmq:
  auth:
    username: "root"
    password: "CHANGE_ME"
    erlangCookie: "CHANGE_ME"
