# Example: Development / Local Testing
# Minimal resources, no TLS, single replicas, Longhorn for MongoDB.

global:
  environment: "development"
  registry: "repo.moovit24.de:443"
  imagePullPolicy: IfNotPresent
  storage:
    csiDriver: "smb.csi.k8s.io"
    storageClassName: "helmut4-csi-storage"
    volumes:
      - name: helmut-storage
        mountPath: "/Volumes/Helmut"
        size: "50Gi"
        source: "//storage-server.local/helmut-dev"
        appMount: true

rbac:
  create: true

appIngress:
  enabled: true
  className: "nginx"
  domain: "helmut.local"
  tls:
    enabled: false
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

docker:
  registry: "repo.moovit24.de:443"
  username: "moovit"
  password: "public"

# MongoDB – single RS node for dev (cloudpirates chart requires RS mode for a valid StatefulSet)
mongodb:
  replicaSet:
    enabled: true
  replicaCount: 1
  persistence:
    storageClass: "longhorn" # or "standard" / "local-path" for minikube/k3s
    size: "20Gi"
  auth:
    rootUsername: "root"
    rootPassword: "dev-password"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# RabbitMQ – single node for dev
rabbitmq:
  replicaCount: 1
  auth:
    username: "root"
    password: "dev-password"
    erlangCookie: "dev-cookie"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# One replica per microservice
serviceReplicas: 1

services:
  hp:
    replicas: 1
  hw:
    replicas: 1
  fx:
    replicas: 1
  co:
    replicas: 1
  io:
    replicas: 1
  hk:
    replicas: 1
  users:
    replicas: 1
  streams:
    replicas: 1
  preferences:
    replicas: 1
  metadata:
    replicas: 1
  logging:
    replicas: 1
  amqp:
    replicas: 1
  license:
    replicas: 1
  language:
    replicas: 1
  cronjob:
    replicas: 1
