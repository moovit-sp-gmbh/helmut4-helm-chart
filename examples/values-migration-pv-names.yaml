# Migration Configuration: Reuse existing PersistentVolumes by name
# Use when PVs already exist in the cluster (e.g. pre-provisioned by ops team)
# and you want to bind to them by name instead of dynamic provisioning.

credentials:
  storage:
    smb:
      username: "admin"       # e.g. domain\username or just username
      password: "CHANGE_ME"   # SMB password
      domain: ""              # Optional: WORKGROUP or DOMAIN

global:
  environment: "production"
  registry: "repo.moovit24.de:443"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: docker-registry-secret-json
  storage:
    csiDriver: "smb.csi.k8s.io"  # or nfs.csi.k8s.io etc.
    storageClassName: "helmut4-csi-storage"
    volumes:
      - name: helmut-storage
        mountPath: "/Volumes/Helmut"
        size: "100Gi"
        source: "//storage-server.example.com/helmut-volumes"
        appMount: true
      - name: mongobackup
        mountPath: "/Volumes/Backup"
        size: "50Gi"
        source: "//backup-server.example.com/mongodb-backups"
        appMount: false

rbac:
  create: true

appIngress:
  enabled: true
  className: "nginx"
  domain: "helmut.example.com"
  tls:
    enabled: true
    provider: "letsencrypt"
    certIssuer: "letsencrypt-prod"

docker:
  registry: "repo.moovit24.de:443"
  username: "moovit"
  password: "public"

# MongoDB - Replica Set, data on Longhorn (NOT on the SMB share)
mongodb:
  replicaSet:
    enabled: true
    name: "rs0"
    key: "CHANGE_ME_BASE64_6_TO_1024_CHARS"
  persistence:
    storageClass: "longhorn"
    size: "50Gi"
  auth:
    rootUsername: "root"
    rootPassword: "CHANGE_ME"

rabbitmq:
  replicaCount: 3
  auth:
    username: "root"
    password: "CHANGE_ME"
    erlangCookie: "CHANGE_ME"

serviceReplicas: 2

services:
  hp:
    replicas: 2
  hw:
    replicas: 2
  fx:
    replicas: 2
  co:
    replicas: 2
  io:
    replicas: 2
  hk:
    replicas: 1
  users:
    replicas: 2
  streams:
    replicas: 2
  preferences:
    replicas: 2
  metadata:
    replicas: 2
  logging:
    replicas: 2
  amqp:
    replicas: 2
  license:
    replicas: 1
  language:
    replicas: 2
  cronjob:
    replicas: 1
