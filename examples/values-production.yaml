# Example: Production Configuration
# Use this as a base for production deployments.
# IMPORTANT: Replace all CHANGE_ME placeholders before deploying!

global:
  environment: "production"
  registry: "repo.moovit24.de:443"
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: docker-registry-secret-json
  storage:
    csiDriver: "smb.csi.k8s.io" # adjust: ebs.csi.aws.com / disk.csi.azure.com etc.
    storageClassName: "helmut4-csi-storage"
    mountPath: "/Volumes/Helmut"
    volume:
      size: "500Gi"
      source: "//storage-server.example.com/helmut"
    mongobackup:
      size: "100Gi"
      source: "//backup-server.example.com/helmut-backups"

credentials:
  storage:
    smb:
      username: "CHANGE_ME"
      password: "CHANGE_ME"
      domain: ""

rbac:
  create: true

appIngress:
  enabled: true
  className: "nginx"
  domain: "helmut.example.com"
  tls:
    enabled: true
    provider: "letsencrypt"
    certIssuer: "letsencrypt-prod"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

docker:
  registry: "repo.moovit24.de:443"
  username: "moovit"
  password: "public"

# MongoDB – 3-node Replica Set on Longhorn block storage
# Do NOT use the SMB share for MongoDB data.
mongodb:
  replicaSet:
    enabled: true
    name: "rs0"
    key: "CHANGE_ME_BASE64_6_TO_1024_CHARS"
    secondaries: 2
  persistence:
    storageClass: "longhorn" # or fast-ssd / managed-premium etc.
    size: "100Gi"
  auth:
    rootUsername: "root"
    rootPassword: "CHANGE_ME"
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# RabbitMQ – 3-node cluster
rabbitmq:
  replicaCount: 3
  auth:
    username: "root"
    password: "CHANGE_ME"
    erlangCookie: "CHANGE_ME"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

# 2 replicas per microservice
serviceReplicas: 2

services:
  hp:
    replicas: 2
  hw:
    replicas: 2
  fx:
    replicas: 2
  co:
    replicas: 2
  io:
    replicas: 2
  hk:
    replicas: 1
  users:
    replicas: 2
  streams:
    replicas: 2
  preferences:
    replicas: 2
  metadata:
    replicas: 2
  logging:
    replicas: 2
  amqp:
    replicas: 2
  license:
    replicas: 1
  language:
    replicas: 2
  cronjob:
    replicas: 1
