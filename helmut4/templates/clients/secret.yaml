{{- if and .Values.linuxClients.enabled (not .Values.linuxClients.adminCredentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: helmut4-client-admin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ required "linuxClients.adminCredentials.username is required unless existingSecret is set" .Values.linuxClients.adminCredentials.username | b64enc | quote }}
  password: {{ required "linuxClients.adminCredentials.password is required unless existingSecret is set" .Values.linuxClients.adminCredentials.password | b64enc | quote }}
{{- end }}
