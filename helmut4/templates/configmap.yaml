apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
data:
  # MongoDB (non-sensitive; credentials injected via Secret)
  {{- $name := .Values.mongodb.fullnameOverride | default "mongodb" }}
  {{- $ns   := .Values.namespace }}
  SPRING_DATA_MONGODB_HOST: {{ printf "%s-0.%s-headless.%s.svc.cluster.local" $name $name $ns | quote }}
  SPRING_DATA_MONGODB_PORT: "27017"
  # No SPRING_DATA_MONGODB_DATABASE: each service uses its native per-service DB
  # (mcc_*/mcp_*), matching docker-compose and required for backup/restore.
  SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: "admin"
  {{- if .Values.mongodb.replicaSet.enabled }}
  SPRING_DATA_MONGODB_REPLICA_SET_NAME: {{ .Values.mongodb.replicaSet.name | quote }}
  # additional-hosts (Spring Boot 2.7+) causes the driver to use MultiServerCluster
  # topology so it discovers the primary even if the first seed is a secondary.
  SPRING_DATA_MONGODB_ADDITIONAL_HOSTS: {{ printf "%s-1.%s-headless.%s.svc.cluster.local:27017,%s-2.%s-headless.%s.svc.cluster.local:27017" $name $name $ns $name $name $ns | quote }}
  {{- end }}
  # RabbitMQ (non-sensitive; password injected via Secret)
  SPRING_RABBITMQ_HOST: {{ include "helmut4.rabbitmq.host" . | quote }}
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: {{ .Values.rabbitmq.auth.username | quote }}
  # Internal service URLs (Spring Boot relaxed-binding: MCC_FX_URL → mcc.fx.url)
  MCC_FX_URL: "http://fx:{{ .Values.services.fx.port }}/v1/fx"
  MCC_CO_URL: "http://co:{{ .Values.services.co.port }}/v1/co"
  MCC_IO_URL: "http://io:{{ .Values.services.io.port }}/v1/io"
  MCC_HK_URL: "http://hk:{{ .Values.services.hk.port }}/v1/hk"
  MCC_USERS_URL: "http://users:{{ .Values.services.users.port }}/v1/members"
  MCC_STREAM_URL: "http://streams:{{ .Values.services.streams.port }}/v1/streams"
  MCC_PREFERENCE_URL: "http://preferences:{{ .Values.services.preferences.port }}/v1/preferences"
  MCC_METADATA_URL: "http://metadata:{{ .Values.services.metadata.port }}/v1/metadata"
  MCC_LOGGING_URL: "http://logging:{{ .Values.services.logging.port }}/v1/logging/helmut"
  MCC_AMQP_URL: "http://amqp:{{ .Values.services.amqp.port }}/v1/amqp/send"
  MCC_LICENSE_URL: "http://license:{{ .Values.services.license.port }}/v1/license"
  MCC_LANGUAGE_URL: "http://language:{{ .Values.services.language.port }}/v1/language"
