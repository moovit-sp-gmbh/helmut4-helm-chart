{{- if .Values.mongoadmin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mongoadmin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
    app: mongoadmin
spec:
  type: ClusterIP
  selector:
    app: mongoadmin
  ports:
    - port: {{ .Values.mongoadmin.port }}
      targetPort: {{ .Values.mongoadmin.port }}
      protocol: TCP
      name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoadmin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
    app: mongoadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongoadmin
  template:
    metadata:
      labels:
        app: mongoadmin
        {{- include "helmut4.labels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helmut4.serviceAccountName" . }}
      
      containers:
        - name: mongoadmin
          image: "{{ .Values.global.registry }}/{{ .Values.mongoadmin.image }}:{{ .Values.mongoadmin.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.mongoadmin.port }}
              name: http
              protocol: TCP
          
          resources:
            {{- toYaml .Values.mongoadmin.resources | nindent 12 }}
          
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mongoadmin.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mongoadmin.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mongodb
                topologyKey: kubernetes.io/hostname
{{- end }}
