{{- if (.Values.networkPolicy | default dict).enabled }}
# Default-deny ingress for every pod in the namespace. Egress is left open
# (DNS, image pulls, external CSI shares). Combined with the allow policies
# below: only intra-namespace and ingress-controller traffic can reach pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helmut4.fullname" . }}-default-deny-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow pods in this namespace to reach each other (services ↔ services ↔
# MongoDB ↔ RabbitMQ ↔ mongobackup, and the Mongo replica-set members).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helmut4.fullname" . }}-allow-intra-namespace
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
# Allow the ingress controller (external traffic) to reach the services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helmut4.fullname" . }}-allow-ingress-controller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | default "kube-system" | quote }}
{{- end }}
