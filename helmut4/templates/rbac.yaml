{{- if .Values.rbac.create }}
{{- if .Values.rbac.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}

---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helmut4.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "helmut4.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "helmut4.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "helmut4.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "helmut4.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
