{{- $root := . }}
{{- range $name, $service := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "helmut4.labels" $root | nindent 4 }}
    app: {{ $service.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $service.name }}
  ports:
    {{- if $service.port }}
    - port: {{ $service.port }}
      targetPort: {{ $service.port }}
      protocol: TCP
      name: http
    {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "helmut4.labels" $root | nindent 4 }}
    app: {{ $service.name }}
spec:
  {{- if not $root.Values.autoscaling.enabled }}
  replicas: {{ $service.replicas | default $root.Values.serviceReplicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $service.name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/rabbitmq-auth: {{ printf "%s:%s" ($root.Values.rabbitmq.auth.username | toString) ($root.Values.rabbitmq.auth.password | toString) | sha256sum }}
        checksum/mongodb-auth: {{ printf "%s:%s" ($root.Values.mongodb.auth.rootUsername | toString) ($root.Values.mongodb.auth.rootPassword | toString) | sha256sum }}
      labels:
        app: {{ $service.name }}
        {{- include "helmut4.labels" $root | nindent 8 }}
    spec:
      {{- if $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $root.Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helmut4.serviceAccountName" $root }}
      automountServiceAccountToken: {{ $root.Values.global.automountServiceAccountToken | default false }}
      {{- if not $service.runAsRoot }}
      {{- with $root.Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if ($root.Values.topologySpread | default dict).enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $service.name }}
      {{- end }}

      containers:
        - name: {{ $service.name }}
          image: "{{ $root.Values.global.registry }}/{{ $service.image }}:{{ $service.tag }}"
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          {{- if not $service.runAsRoot }}
          {{- with $root.Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if $service.port }}
          ports:
            - containerPort: {{ $service.port }}
              name: http
              protocol: TCP
          {{- end }}
          
          envFrom:
            - configMapRef:
                name: service-config
          env:
            - name: SPRING_DATA_MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "helmut4.mongodb.secretName" $root }}
                  key: {{ include "helmut4.mongodb.usernameKey" $root }}
            - name: SPRING_DATA_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helmut4.mongodb.secretName" $root }}
                  key: {{ include "helmut4.mongodb.passwordKey" $root }}
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.rabbitmq.fullnameOverride | default "rabbitmq" }}
                  key: {{ $root.Values.rabbitmq.auth.existingPasswordKey | default "password" }}
          
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          
          {{- if $service.port }}
          # startupProbe gates the slow JVM boot; liveness/readiness only run
          # once it passes (up to 30*10s = 5m). No actuator on these images, so tcpSocket.
          startupProbe:
            tcpSocket:
              port: {{ $service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          livenessProbe:
            tcpSocket:
              port: {{ $service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            tcpSocket:
              port: {{ $service.port }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          
          {{- if or $service.volumeMounts (not $service.runAsRoot) }}
          volumeMounts:
            {{- if not $service.runAsRoot }}
            # Writable /tmp for the readOnlyRootFilesystem services (Tomcat work dirs, JVM temp).
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if $service.volumeMounts }}
            {{- range $.Values.global.storage.volumes }}
            {{- if .appMount }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- end }}
            {{- end }}
          {{- end }}

      {{- if or $service.volumeMounts (not $service.runAsRoot) }}
      volumes:
        {{- if not $service.runAsRoot }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if $service.volumeMounts }}
        {{- range $.Values.global.storage.volumes }}
        {{- if .appMount }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .name }}-pvc
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
