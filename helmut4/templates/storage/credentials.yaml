{{- if .Values.credentials.storage.smb.username }}
---
# SMB CSI Driver Secret for authentication
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helmut4.fullname" . }}-smb-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
    component: storage
    storage-type: smb
type: Opaque
stringData:
  username: {{ .Values.credentials.storage.smb.username | quote }}
  password: {{ .Values.credentials.storage.smb.password | quote }}
  {{- if .Values.credentials.storage.smb.domain }}
  domain: {{ .Values.credentials.storage.smb.domain | quote }}
  {{- end }}
{{- end }}

{{- if .Values.credentials.storage.nfs.username }}
---
# NFS CSI Driver Secret for authentication (if needed)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helmut4.fullname" . }}-nfs-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helmut4.labels" . | nindent 4 }}
    component: storage
    storage-type: nfs
type: Opaque
stringData:
  username: {{ .Values.credentials.storage.nfs.username | quote }}
  password: {{ .Values.credentials.storage.nfs.password | quote }}
{{- end }}
