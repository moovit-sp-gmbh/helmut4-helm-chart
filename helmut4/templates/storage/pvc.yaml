{{- if .Values.global.storage }}
{{- if .Values.global.storage.volumes }}
{{- range .Values.global.storage.volumes }}
---
# StorageClass for volume: {{ .name }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $.Values.global.storage.storageClassName }}-{{ .name }}
provisioner: {{ $.Values.global.storage.csiDriver }}
{{- if .source }}
parameters:
  # SMB/NFS mount parameters
  source: {{ .source | quote }}
  {{- if and (contains "smb" $.Values.global.storage.csiDriver) $.Values.credentials.storage.smb.username }}
  # Reference SMB credentials secret
  csi.storage.k8s.io/node-stage-secret-name: {{ include "helmut4.fullname" $ }}-smb-credentials
  csi.storage.k8s.io/node-stage-secret-namespace: {{ $.Values.namespace }}
  {{- end }}
{{- end }}
{{- if contains "smb" $.Values.global.storage.csiDriver }}
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=999
  - gid=999
  - noperm
{{- end }}
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer

---
# PersistentVolumeClaim for {{ .name }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}-pvc
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "helmut4.labels" $ | nindent 4 }}
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ $.Values.global.storage.storageClassName }}-{{ .name }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}
{{- end }}
