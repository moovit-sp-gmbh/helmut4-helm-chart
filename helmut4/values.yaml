# Environment configuration
# These URLs are built dynamically but can be overridden
environment:
  mongodb_host: "mongodb-0.mongodb-headless:27017"
  elasticsearch_uri: "http://elasticsearch:9200"
  rabbitmq_host: "rabbitmq-0.rabbitmq-headless"

# TLS Configuration
tls:
  enabled: true
  certFile: "/etc/tls/certs/server.crt"
  keyFile: "/etc/tls/certs/server.key"
