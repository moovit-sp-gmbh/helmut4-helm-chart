# Image Versions - Centralized for easy updates
versions:
  mongodb: &mongodbVersion "4.12.0.0"
  rabbitmq: &rabbitmqVersion "4.1.0.0"

  # Microservices
  hp: &hpVersion "4.12.0.3"
  hw: &hwVersion "4.12.0.3"
  fx: &fxVersion "4.12.0.2"
  co: &coVersion "4.12.0.6"
  io: &ioVersion "4.12.0.1"
  hk: &hkVersion "4.12.0.0"
  users: &usersVersion "4.12.0.1"
  streams: &streamsVersion "4.12.0.5"
  preferences: &preferencesVersion "4.12.0.0"
  metadata: &metadataVersion "4.12.0.0"
  logging: &loggingVersion "4.12.0.0"
  amqp: &amqpVersion "4.12.0.0"
  license: &licenseVersion "4.12.0.3"
  language: &languageVersion "4.12.0.0"
  cronjob: &cronjobVersion "4.12.0.0"

# Storage Credentials - Centralized for easy management
# Used by CSI drivers (SMB, NFS, etc.) to access external shares
credentials:
  storage:
    # SMB Share Credentials
    smb:
      # Username for SMB authentication (e.g., domain\username or username)
      username: ""
      # Password for SMB authentication
      password: ""
      # Optional: SMB domain name
      domain: ""

    # NFS credentials (typically not needed for standard NFS, but some setups require it)
    nfs:
      # Leave empty for anonymous NFS access
      username: ""
      password: ""

# Global settings
global:
  environment: "production"
  # Docker registry configuration
  registry: "repo.moovit24.de:443"
  imagePullPolicy: IfNotPresent

  # Image pull secrets for private registry
  imagePullSecrets:
    - name: docker-registry-secret-json

  # Storage configuration
  storage:
    # CSI driver for mounting external storage (e.g., "smb.csi.k8s.io" for SMB, "nfs.csi.k8s.io" for NFS)
    csiDriver: "csi-driver-name"

    # Storage class configuration
    storageClassName: "helmut4-csi-storage"

    # Container mount point for Helmut storage
    # This is where the storage will be mounted inside containers
    mountPath: "/Volumes/Helmut"

    # Main /Volumes storage
    volume:
      size: "100Gi"
      # For SMB shares: //server/share or \\server\share
      # For NFS shares: server:/path
      # Leave empty to use dynamic provisioning
      source: ""

# Namespace
namespace: helmut4

# RBAC
rbac:
  create: true
  createNamespace: true # Set to false if namespace already exists

# Service Account
serviceAccount:
  create: true
  name: helmut4-sa

# Main application ingress configuration
appIngress:
  enabled: true
  className: "nginx"

  # Main ingress domain - all services route through this domain
  domain: "helmut-k8s.moovit24.de"

  # TLS configuration
  tls:
    enabled: true
    secretName: "helmut4-tls"

    # Two options for TLS certificates:
    # 1. Using Let's Encrypt (automatic via cert-manager) - set certIssuer
    # 2. Using your own certificate - set provider: "custom" and provide certFile/keyFile

    # Option 1: Let's Encrypt configuration
    # Set certIssuer to use cert-manager (e.g., "letsencrypt-prod", "letsencrypt-staging")
    certIssuer: "letsencrypt-prod"

    # Option 2: Custom certificate configuration
    provider: "letsencrypt" # Set to "custom" to use your own certificate

    # For custom certificates, provide the paths to cert and key files
    # These will be mounted from a Secret in the cluster
    certFile: "/etc/tls/certs/tls.crt"
    keyFile: "/etc/tls/certs/tls.key"

  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebSocket support – required for RabbitMQ STOMP-over-WS (/ws) and users service (/v1/ws).
    # ingress-nginx sets Upgrade/Connection headers natively via its $connection_upgrade map;
    # only timeouts and HTTP/1.1 need to be forced explicitly here.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

# Docker Registry Credentials
docker:
  registry: "repo.moovit24.de:443"
  username: "moovit" # Standard username für public images
  password: "public" # Standard password für public images
  email: ""

# MongoDB Configuration
mongodb:
  enabled: true
  fullnameOverride: "mongodb"
  database: "helmut4"

  auth:
    rootUsername: "root"
    rootPassword: "bitte"
    # When existingSecret is set, no mongodb-credentials Secret is created by this chart.
    # The MongoDB sub-chart creates a Secret named after fullnameOverride (e.g. "mongodb")
    # with key "mongodb-root-password". Set existingSecret to reuse it directly.
    existingSecret: ""
    existingUsernameKey: ""
    existingPasswordKey: "mongodb-root-password"

  replicaSet:
    enabled: true
    name: "rs0"
    key: "aGVsbXV0NHJlcGxpY2FzZXRrZXkxMjM0NTY="

  # Persistent storage for MongoDB data.
  # Use a block-storage class (e.g. Longhorn) – NOT the SMB share.
  # SMB is a file-share and causes problems with MongoDB (locking, stale data on
  # reinstall because the share is not wiped when PVCs are deleted).
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: "50Gi"
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: "4"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "8Gi"

  metrics:
    enabled: false

  # Chart-native extension point (documented in cloudpirates/mongodb README).
  # In replicaSet mode the chart only creates the headless service (mongodb-headless).
  # The microservice startup scripts perform a TCP health-check against "mongodb:27017"
  # before Spring Boot starts.  We add a regular ClusterIP service via extraObjects so
  # that name resolves – Spring Boot itself connects via SPRING_DATA_MONGODB_HOST which
  # points to the headless service for full replica-set topology awareness.
  extraObjects:
    - apiVersion: v1
      kind: Service
      metadata:
        name: mongodb
        namespace: "{{ .Release.Namespace }}"
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/name: mongodb
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          service-type: primary-secondary
        ports:
          - port: 27017
            targetPort: 27017
            protocol: TCP

# RabbitMQ Configuration
#
# Single-node deployment by design.
#
# A multi-node RabbitMQ cluster only delivers HA when ALL of these are in
# place:
#   1. Quorum queues (default_queue_type = quorum) – classic mirrored
#      queues were removed in RabbitMQ 4.0, so quorum (or streams) is the
#      only replicated queue type left. This also requires the Helmut4
#      services to either declare quorum queues explicitly or rely on the
#      default_queue_type setting.
#   2. Per-pod persistent storage – without it the Mnesia metadata and
#      any quorum-queue Raft state are wiped on every pod restart.
#   3. podAntiAffinity – otherwise multiple rabbitmq pods can land on the
#      same Kubernetes node and a single node loss takes the cluster
#      below quorum.
#   4. A PodDisruptionBudget – to keep node drains from doing the same.
#
# Without those four pieces a 3-node cluster shares topology (publish to
# any node, consume from any node), but each message still lives on the
# single node that owns its classic queue – so a node loss makes that
# queue unavailable. That is the same failure mode as a single node, with
# more moving parts and split-brain risk on top.
#
# Until those four pieces are added, one node is more honest than three.
rabbitmq:
  fullnameOverride: "rabbitmq"
  replicaCount: 1

  auth:
    username: "root"
    password: "bitte"
    erlangCookie: "secretcookie"
    existingErlangCookieKey: "erlang-cookie"
    existingPasswordKey: "password"

  # K8s peer discovery is only meaningful in a multi-node cluster. Disable
  # it for the single-node deployment so the pod does not waste cycles
  # looking for peers it will never find.
  peerDiscoveryK8sPlugin:
    enabled: false
    addressType: hostname

  rbac:
    create: true
  serviceAccount:
    create: true

  service:
    type: ClusterIP

  persistence:
    enabled: false

  metrics:
    enabled: false

  # Disable the subchart's own Ingress – routing is handled by the parent application ingress
  ingress:
    enabled: false
    tls: []

  # Webstomp configuration for Ingress
  webstomp: 15674

  # rabbitmq_web_stomp serves STOMP-over-WebSocket on /ws (port 15674).
  # rabbitmq_stomp is the underlying dependency – list it explicitly so
  # enabled_plugins does not rely on transitive resolution.
  additionalPlugins:
    - rabbitmq_stomp
    - rabbitmq_web_stomp

  # Expose the web_stomp port on the Service (and the container) so the
  # parent Ingress (/ws -> rabbitmq:15674) has a real upstream to talk to.
  extraPorts:
    - name: web-stomp
      port: 15674
      targetPort: 15674
      containerPort: 15674

  config:
    # Pin the web_stomp listener; the plugin default is also 15674 but
    # being explicit avoids surprises on plugin upgrades.
    extraConfiguration: |
      web_stomp.tcp.port = 15674

# Service replicas
serviceReplicas: 2

