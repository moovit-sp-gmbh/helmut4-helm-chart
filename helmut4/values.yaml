# -- Centralised image tags so the whole stack bumps together. Anchors below
# are referenced from `mongodb.image.tag`, `rabbitmq.image.tag` and the
# `services.<name>.tag` entries.
versions:
  # -- Tag for the bundled cloudpirates/mongodb image.
  mongodb: &mongodbVersion "4.12.0.0"
  # -- Tag for the bundled cloudpirates/rabbitmq image.
  rabbitmq: &rabbitmqVersion "4.1.0.0"

  # Microservices
  # -- Image tag for the `hp` (HelmutPanel) microservice.
  hp: &hpVersion "4.12.0.3"
  # -- Image tag for the `hw` (HelmutWorker) microservice.
  hw: &hwVersion "4.12.0.3"
  # -- Image tag for the `fx` microservice.
  fx: &fxVersion "4.12.0.2"
  # -- Image tag for the `co` microservice.
  co: &coVersion "4.12.0.6"
  # -- Image tag for the `io` microservice.
  io: &ioVersion "4.12.0.1"
  # -- Image tag for the `hk` microservice.
  hk: &hkVersion "4.12.0.0"
  # -- Image tag for the `users` microservice.
  users: &usersVersion "4.12.0.1"
  # -- Image tag for the `streams` microservice.
  streams: &streamsVersion "4.12.0.5"
  # -- Image tag for the `preferences` microservice.
  preferences: &preferencesVersion "4.12.0.0"
  # -- Image tag for the `metadata` microservice.
  metadata: &metadataVersion "4.12.0.0"
  # -- Image tag for the `logging` microservice.
  logging: &loggingVersion "4.12.0.0"
  # -- Image tag for the `amqp` microservice.
  amqp: &amqpVersion "4.12.0.0"
  # -- Image tag for the `license` microservice.
  license: &licenseVersion "4.12.0.3"
  # -- Image tag for the `language` microservice.
  language: &languageVersion "4.12.0.0"
  # -- Image tag for the `cronjob` microservice.
  cronjob: &cronjobVersion "4.12.0.0"

# -- Storage credentials forwarded to CSI drivers (SMB / NFS) that mount
# external file shares into the Helmut4 pods. Empty values mean the chart
# does not create the corresponding `Secret`.
credentials:
  storage:
    smb:
      # -- SMB user (e.g. `domain\\user` or plain `user`). Leave empty if SMB
      # is not used.
      username: ""
      # -- SMB password. Leave empty if SMB is not used.
      password: ""
      # -- Optional SMB domain.
      domain: ""

    nfs:
      # -- NFS user. Most NFS setups are anonymous; leave empty unless your
      # server requires authentication.
      username: ""
      # -- NFS password. Most NFS setups are anonymous; leave empty unless
      # your server requires authentication.
      password: ""

# -- Cluster-wide defaults shared by every microservice Deployment.
global:
  # -- Free-form environment tag exposed to the workloads. Common values are
  # `production`, `staging`, `development`.
  environment: "production"
  # -- Docker registry hostname (and optional port) prefixed to every image
  # reference rendered from `services.<name>.image`.
  registry: "repo.moovit24.de:443"
  # -- Pod-level image pull policy applied to every container the chart
  # renders. One of `Always`, `IfNotPresent`, `Never`.
  imagePullPolicy: IfNotPresent

  # -- List of `imagePullSecrets` attached to every workload. The default
  # entry refers to the Secret created from `docker.*` below.
  imagePullSecrets:
    - name: docker-registry-secret-json

  # -- (object) Pod-level `securityContext` applied to every Deployment
  # the chart renders. Leave empty to keep cluster defaults; populate
  # when the platform requires non-root execution or a specific `fsGroup`
  # so the mounted PVCs are writable. Example:
  #   runAsNonRoot: true
  #   runAsUser: 999
  #   fsGroup: 999  # match the SMB mountOptions (uid=999, gid=999)
  podSecurityContext: {}

  # -- (object) Container-level `securityContext` applied to every
  # container the chart renders. Leave empty for cluster defaults.
  # Common hardening (only enable after verifying the Helmut4 services
  # actually run with these constraints):
  #   allowPrivilegeEscalation: false
  #   readOnlyRootFilesystem: false  # Spring Boot writes to /tmp
  #   capabilities:
  #     drop: ["ALL"]
  containerSecurityContext: {}

  storage:
    # -- CSI driver that backs the application file storage (e.g.
    # `smb.csi.k8s.io`, `nfs.csi.k8s.io`). The chart only references the
    # name; the driver itself must already be installed in the cluster.
    csiDriver: "csi-driver-name"

    # -- Name of the StorageClass the chart creates and consumes for the
    # `/Volumes/Helmut` mount.
    storageClassName: "helmut4-csi-storage"

    # -- List of PersistentVolumeClaims to create. Each entry gets its own
    # StorageClass and PVC. Services with `volumeMounts: true` receive all
    # volumes mounted at their respective `mountPath`.
    volumes:
      - # -- Name used for the PVC (`<name>-pvc`) and the StorageClass
        # (`<storageClassName>-<name>`).
        name: helmut-storage
        # -- Path inside the containers where this volume is mounted.
        mountPath: "/Volumes/Helmut"
        # -- Size requested for this PVC.
        size: "100Gi"
        # -- Backend share to mount. Use `//server/share` for SMB and
        # `server:/path` for NFS. Leave empty to use dynamic provisioning.
        source: ""
        # -- Mount this volume on all services that have `volumeMounts: true`.
        # Set to `false` for volumes only used by specific jobs (e.g. backup).
        appMount: true

# -- Kubernetes namespace that owns every resource this chart creates.
namespace: helmut4

rbac:
  # -- Render the RBAC `Role` / `RoleBinding` that the microservices need.
  create: true
  # -- Also render a `Namespace` object. Set to `false` if the namespace
  # already exists or is managed elsewhere.
  createNamespace: true

serviceAccount:
  # -- Render a dedicated ServiceAccount for the workloads.
  create: true
  # -- Name of the ServiceAccount referenced from every Deployment.
  name: helmut4-sa

# -- Public Ingress / HTTPRoute that fronts every Helmut4 microservice
# (one host, many path prefixes). Disabling this requires routing the
# services through another mechanism.
#
# kubernetes/ingress-nginx is being retired in March 2026
# (https://kubernetes.io/blog/2025/11/11/ingress-nginx-retirement/). The
# defaults below still target ingress-nginx so existing installs keep
# working; new installs can pick another controller or switch to Gateway
# API (`api: "gateway"`). See README → "Ingress controllers" for recipes.
appIngress:
  # -- Render the application routing resource.
  enabled: true

  # -- Routing API. `ingress` renders a `networking.k8s.io/v1` Ingress
  # (default, backwards compatible); `gateway` renders a
  # `gateway.networking.k8s.io/v1` HTTPRoute and requires a pre-existing
  # Gateway in the cluster (typically owned by the platform team). The
  # two modes are mutually exclusive — only one resource is rendered.
  api: "ingress"

  # -- IngressClass name. Used only when `api` is `ingress`. Defaults to
  # `nginx` for kubernetes/ingress-nginx; common alternatives are
  # `traefik`, `nginx` (NGINX Inc.'s controller — same class, different
  # annotation prefix `nginx.org/*`) and `haproxy`.
  className: "nginx"

  # -- Public hostname terminated by the Ingress / matched by the
  # HTTPRoute. Becomes `spec.rules[].host` for Ingress or
  # `spec.hostnames[]` for HTTPRoute.
  domain: "helmut-k8s.moovit24.de"

  tls:
    # -- Enable TLS termination on the Ingress. Ignored when
    # `api: "gateway"` — Gateway API terminates TLS on the Gateway
    # listener (operator-owned), not on the HTTPRoute.
    enabled: true
    # -- Name of the Secret used by the TLS section of the Ingress. Created
    # automatically when `tls.provider` is `letsencrypt`.
    secretName: "helmut4-tls"

    # -- cert-manager ClusterIssuer used when `tls.provider` is
    # `letsencrypt` (typically `letsencrypt-prod` or `letsencrypt-staging`).
    certIssuer: "letsencrypt-prod"

    # -- TLS provider. `letsencrypt` makes cert-manager issue a certificate;
    # `custom` reuses the cert/key paths configured below.
    provider: "letsencrypt"

    # -- Container path of the TLS certificate when `tls.provider` is
    # `custom`. Mounted from a pre-existing Secret.
    certFile: "/etc/tls/certs/tls.crt"
    # -- Container path of the TLS private key when `tls.provider` is
    # `custom`. Mounted from a pre-existing Secret.
    keyFile: "/etc/tls/certs/tls.key"

  # -- Annotations applied to the Ingress object. Defaults assume
  # kubernetes/ingress-nginx and enable WebSocket support for
  # STOMP-over-WS (RabbitMQ `/ws`) and the users service (`/v1/ws`):
  # ingress-nginx already sets `Upgrade`/`Connection` natively, so only
  # HTTP/1.1 and the long timeouts need to be forced explicitly. Replace
  # these when running another controller — see README → "Ingress
  # controllers" for per-controller recipes. Ignored when
  # `api: "gateway"` (HTTPRoute annotations live under `gateway.annotations`).
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Preferences restore/import POSTs exceed nginx's 1m default; raise if larger.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

  # -- Gateway API settings. Used only when `api: "gateway"`. The Gateway
  # itself is NOT chart-managed — it belongs to the platform team and is
  # referenced via `parentRef`. cert-manager integration for Gateway API
  # uses the `cert-manager.io/cluster-issuer` annotation on the Gateway
  # (not on the HTTPRoute), so TLS lives entirely outside this chart in
  # Gateway mode. WebSocket support is native to HTTPRoute on conformant
  # implementations (Envoy Gateway, Istio, Cilium, Contour), but idle
  # timeouts are implementation-specific (Envoy defaults to 5 minutes —
  # configure per-controller policy CRDs if your STOMP connections need
  # longer).
  gateway:
    parentRef:
      # -- Name of the Gateway resource that terminates traffic.
      name: ""
      # -- Namespace of the Gateway. Empty means the HTTPRoute's namespace.
      # Cross-namespace references require a ReferenceGrant on the Gateway side.
      namespace: ""
      # -- Optional listener name (`spec.listeners[].name` on the Gateway).
      sectionName: ""
    # -- Annotations applied to the HTTPRoute. Most users leave this empty;
    # implementation-specific traffic policies (timeouts, retries) are
    # usually separate CRs (e.g. Envoy Gateway `BackendTrafficPolicy`,
    # Istio `DestinationRule`) and not chart-managed.
    annotations: {}

# -- Credentials for the private Docker registry that hosts the Helmut4
# images. Rendered into a `kubernetes.io/dockerconfigjson` Secret named
# `docker-registry-secret-json` and referenced via `global.imagePullSecrets`.
docker:
  # -- Registry hostname (and optional port) that the Secret is scoped to.
  registry: "repo.moovit24.de:443"
  # -- Registry username. The default `moovit` works for the public images.
  username: "moovit"
  # -- Registry password. The default `public` works for the public images.
  password: "public"
  # -- Optional contact email written into the dockerconfigjson Secret.
  email: ""

# -- Bundled cloudpirates/mongodb subchart. Only the keys the parent chart
# overrides are listed below; everything not mentioned falls through to the
# subchart's own defaults (see its README and `values.schema.json`).
mongodb:
  # -- Enable the bundled MongoDB subchart.
  enabled: true
  # -- Override the rendered Service / StatefulSet name (kept short so the
  # microservices can reach `mongodb:27017`).
  fullnameOverride: "mongodb"
  # -- Initial database created by the MongoDB subchart. NOT used by the
  # microservices — they use their native per-service DBs (mcc_*/mcp_*).
  database: "helmut4"

  auth:
    # -- MongoDB root username.
    rootUsername: "root"
    # -- MongoDB root password. Replace before exposing the service.
    rootPassword: "***REMOVED***"
    # -- Reuse an existing Secret instead of letting the chart create one.
    # When set, no `mongodb-credentials` Secret is rendered – the subchart
    # already creates a Secret named after `fullnameOverride` with key
    # `mongodb-root-password`, which can be referenced here.
    existingSecret: ""
    # -- Key inside `existingSecret` that holds the username. Empty means
    # the subchart's default key.
    existingUsernameKey: ""
    # -- Key inside `existingSecret` that holds the password.
    existingPasswordKey: "mongodb-root-password"

  replicaSet:
    # -- Run MongoDB as a 3-node replica set. Disabling this falls back to
    # standalone mode and breaks the microservices' default connection
    # string.
    enabled: true
    # -- Replica set name.
    name: "rs0"
    # -- Replica set keyfile contents (base64). Replace before exposing.
    key: "***REMOVED***="

  # -- Persistent storage for MongoDB data. Use a block-storage class (e.g.
  # Longhorn) – NOT the SMB share. SMB is a file-share and causes problems
  # with MongoDB (locking, stale data on reinstall because the share is not
  # wiped when PVCs are deleted).
  persistence:
    # -- Bind a PVC to each replica.
    enabled: true
    # -- StorageClass that backs the PVCs. Block storage only.
    storageClass: "longhorn"
    # -- Size of every replica's PVC.
    size: "50Gi"
    # -- PVC access mode.
    accessMode: ReadWriteOnce

  # -- Resource requests / limits forwarded to every MongoDB pod.
  resources:
    requests:
      cpu: "4"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "8Gi"

  metrics:
    # -- Enable the metrics exporter sidecar from the subchart.
    enabled: false

  # -- Chart-native extension point (documented in cloudpirates/mongodb
  # README). In replicaSet mode the subchart only creates the headless
  # service (`mongodb-headless`). The microservice startup scripts perform a
  # TCP health-check against `mongodb:27017` before Spring Boot starts, so
  # we add a regular ClusterIP service via `extraObjects` to make that name
  # resolve. Spring Boot itself connects via `SPRING_DATA_MONGODB_HOST`,
  # which still points at the headless service for full replica-set
  # topology awareness.
  extraObjects:
    - apiVersion: v1
      kind: Service
      metadata:
        name: mongodb
        namespace: "{{ .Release.Namespace }}"
      spec:
        type: ClusterIP
        selector:
          app.kubernetes.io/name: mongodb
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          service-type: primary-secondary
        ports:
          - port: 27017
            targetPort: 27017
            protocol: TCP

# -- Bundled cloudpirates/rabbitmq subchart. Single-node by design: a
# multi-node RabbitMQ cluster only delivers HA when ALL of these are in
# place:
#   1. Quorum queues (`default_queue_type = quorum`) – classic mirrored
#      queues were removed in RabbitMQ 4.0, so quorum (or streams) is the
#      only replicated queue type left. This also requires the Helmut4
#      services to either declare quorum queues explicitly or rely on the
#      `default_queue_type` setting.
#   2. Per-pod persistent storage – without it the Mnesia metadata and any
#      quorum-queue Raft state are wiped on every pod restart.
#   3. podAntiAffinity – otherwise multiple rabbitmq pods can land on the
#      same Kubernetes node and a single node loss takes the cluster below
#      quorum.
#   4. A PodDisruptionBudget – to keep node drains from doing the same.
# Without those four pieces a 3-node cluster shares topology (publish to
# any node, consume from any node), but each message still lives on the
# single node that owns its classic queue – so a node loss makes that
# queue unavailable. Same failure mode as a single node, with more moving
# parts and split-brain risk on top. Until those four pieces are added,
# one node is more honest than three.
rabbitmq:
  # -- Subchart release name override (controls Service/StatefulSet names).
  fullnameOverride: "rabbitmq"
  # -- Number of RabbitMQ pods. Keep at `1` until quorum queues +
  # persistence + podAntiAffinity + PDB are all in place; see the
  # block comment above for the reasoning.
  replicaCount: 1

  auth:
    # -- Internal RabbitMQ user used by the Spring microservices. The
    # browser-side STOMP connection authenticates a different way (see
    # `config.extraConfiguration` below — the `rabbit_auth_backend_http`
    # plugin forwards STOMP CONNECT credentials to the `users` service
    # so logged-in panel users authenticate against the Helmut user
    # store in MongoDB). This value only needs to match what the chart
    # injects via `SPRING_RABBITMQ_USERNAME`.
    username: "root"
    # -- RabbitMQ password for the internal `username` user. Replace
    # before exposing the service.
    password: "***REMOVED***"
    # -- Erlang cookie used by the cluster nodes. Replace before exposing.
    erlangCookie: "***REMOVED***"
    # -- Key inside the existing Secret that holds the Erlang cookie.
    existingErlangCookieKey: "erlang-cookie"
    # -- Key inside the existing Secret that holds the password.
    existingPasswordKey: "password"

  # -- K8s peer discovery is only meaningful in a multi-node cluster.
  # Disabled for the single-node deployment so the pod does not waste
  # cycles looking for peers it will never find.
  peerDiscoveryK8sPlugin:
    # -- Enable the rabbitmq_peer_discovery_k8s plugin.
    enabled: false
    # -- Address type used to discover peers (`hostname` or `ip`).
    addressType: hostname

  rbac:
    # -- Render Role / RoleBinding for the RabbitMQ pods.
    create: true
  serviceAccount:
    # -- Render a dedicated ServiceAccount for the RabbitMQ pods.
    create: true

  service:
    # -- Service type for the RabbitMQ Service. The parent Ingress fronts
    # the WebSocket path, so a ClusterIP is enough.
    type: ClusterIP

  # -- PVC settings for the RabbitMQ data directory. Disabled for the
  # single-node deployment; flip to `enabled: true` (and add a real
  # storageClass / size) before scaling out – see the block comment above
  # this `rabbitmq` section.
  persistence:
    enabled: false

  metrics:
    # -- Enable the Prometheus exporter shipped with the subchart.
    enabled: false

  # -- Disable the subchart's own Ingress – routing is handled by the
  # parent application Ingress (`appIngress`).
  ingress:
    enabled: false
    tls: []

  # -- Port the parent application Ingress targets for the
  # STOMP-over-WebSocket route (`/ws`). Must match the rabbitmq web_stomp
  # listener configured below.
  webstomp: 15674

  # -- Plugins enabled in addition to the subchart's defaults.
  # `rabbitmq_web_stomp` serves STOMP-over-WebSocket on `/ws` (port 15674);
  # `rabbitmq_stomp` is the underlying dependency – list it explicitly so
  # `enabled_plugins` does not rely on transitive resolution.
  # `rabbitmq_auth_backend_http` lets RabbitMQ delegate auth lookups to
  # the `users` microservice (the Helmut frontend STOMP CONNECT path).
  additionalPlugins:
    - rabbitmq_stomp
    - rabbitmq_web_stomp
    - rabbitmq_auth_backend_http

  # -- Extra ports added to the rabbitmq Service AND StatefulSet pod. The
  # entry below exposes the web_stomp port so the parent Ingress
  # (`/ws -> rabbitmq:15674`) has a real upstream to talk to.
  extraPorts:
    - name: web-stomp
      port: 15674
      targetPort: 15674
      containerPort: 15674

  config:
    # -- Free-form snippet appended to `rabbitmq.conf`.
    #
    # Two things are pinned here:
    #
    # 1. `web_stomp.tcp.port = 15674` — the plugin default is also
    #    15674, but being explicit avoids surprises on plugin upgrades.
    #
    # 2. The auth_backends chain. The Spring microservices authenticate
    #    against the internal user (`auth.username`/`auth.password`
    #    above). The Helmut panel's STOMP-over-WS connection uses the
    #    logged-in panel user's credentials, which don't exist in
    #    RabbitMQ's internal user table — so we fall through to the
    #    `rabbit_auth_backend_http` plugin, which POSTs the credentials
    #    to the `users` microservice for validation against the Helmut
    #    user store in MongoDB. The four HTTP endpoints below mirror
    #    what moovit's `mcc_rabbitmq` image preloads, so the chart
    #    behaves like the canonical docker-compose deployment.
    extraConfiguration: |
      web_stomp.tcp.port = 15674

      auth_backends.1 = internal
      auth_backends.2 = rabbit_auth_backend_http
      auth_http.http_method   = post
      auth_http.user_path     = http://users:8000/v1/members/auth/rabbitmq/user
      auth_http.vhost_path    = http://users:8000/v1/members/auth/rabbitmq/vhost
      auth_http.resource_path = http://users:8000/v1/members/auth/rabbitmq/resource
      auth_http.topic_path    = http://users:8000/v1/members/auth/rabbitmq/topic

# -- Default replica count for any microservice that does not set its own
# `services.<name>.replicas`. Ignored when `autoscaling.enabled` is true.
serviceReplicas: 2

# -- PodDisruptionBudget for every microservice whose effective replica
# count is >= 2. Default disabled so first-time installs on small clusters
# don't block node drains; flip on once the cluster has the headroom for
# every Deployment to keep `minAvailable` pods up during voluntary
# evictions.
podDisruptionBudget:
  # -- Render the PDBs.
  enabled: false
  # -- Minimum pods that must stay up during voluntary disruptions.
  # Integers are absolute; strings ending in `%` are percentages.
  minAvailable: 1

# -- HorizontalPodAutoscaler for every microservice. Requires
# `metrics-server` in the cluster. When enabled the static
# `services.<name>.replicas` / `serviceReplicas` is dropped from the
# Deployment so the HPA fully owns the replica count.
autoscaling:
  # -- Render the HPAs.
  enabled: false
  # -- Lower bound for every service.
  minReplicas: 1
  # -- Upper bound for every service.
  maxReplicas: 10
  # -- Target average CPU utilization (%) that triggers scaling.
  targetCPUUtilizationPercentage: 80
  # -- Optional target memory utilization (%). Leave null to skip the
  # memory metric. Memory-based scaling rarely scales down on Spring
  # Boot apps (JVM holds the heap), so enable with care.
  targetMemoryUtilizationPercentage: null

# -- Prometheus Operator ServiceMonitor for every microservice. Requires
# the prometheus-operator CRDs (`monitoring.coreos.com/v1`) in the
# cluster. The services expose Spring Boot Actuator on the same port as
# the application traffic.
serviceMonitor:
  # -- Render the ServiceMonitors.
  enabled: false
  # -- Scrape interval.
  interval: "30s"
  # -- Per-target scrape timeout.
  scrapeTimeout: "10s"
  # -- Actuator endpoint that exposes Prometheus metrics.
  path: "/actuator/prometheus"
  # -- Extra labels to attach (e.g. `release: prometheus` so the
  # prometheus-operator picks the SM up).
  labels: {}

# -- (object) Per-microservice deployment settings. Each key is a service
# identifier (`hp`, `hw`, `fx`, ...) and shares the same shape:
# `name`, `image`, `tag`, `port`, `replicas`, `resources` and an optional
# `volumeMounts` flag that enables the shared `/Volumes/Helmut` mount.
# Anchors below are resolved from the `versions:` block at the top.
services:
  hp:
    name: hp
    image: mcp_hp
    tag: *hpVersion
    port: 8081
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  hw:
    name: hw
    image: mcp_hw
    tag: *hwVersion
    port: 8080
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  fx:
    name: fx
    image: mcp_fx
    tag: *fxVersion
    port: 8100
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
    volumeMounts: true

  co:
    name: co
    image: mcp_co
    tag: *coVersion
    port: 8101
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
    volumeMounts: true

  io:
    name: io
    image: mcp_io
    tag: *ioVersion
    port: 8102
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
    volumeMounts: true

  hk:
    name: hk
    image: mcp_hk
    tag: *hkVersion
    port: 8103
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"

  users:
    name: users
    image: mcc_users
    tag: *usersVersion
    port: 8000
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
    volumeMounts: true

  streams:
    name: streams
    image: mcc_streams
    tag: *streamsVersion
    port: 8001
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
    volumeMounts: true

  preferences:
    name: preferences
    image: mcc_preferences
    tag: *preferencesVersion
    port: 8002
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  metadata:
    name: metadata
    image: mcc_metadata
    tag: *metadataVersion
    port: 8003
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  logging:
    name: logging
    image: mcc_logging
    tag: *loggingVersion
    port: 8004
