  hp:
    name: hp
    image: mcp_hp
    tag: *hpVersion
    port: 8081
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  hw:
