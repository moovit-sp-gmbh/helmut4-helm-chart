apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: helmut4-csi-storage
provisioner: smb.csi.k8s.io
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  source: "//file.surfplanet.home/RAID/HELMUT"
  csi.storage.k8s.io/node-stage-secret-namespace: "helmut4"
  csi.storage.k8s.io/node-stage-secret-name: "smb-creds"
  csi.storage.k8s.io/provisioner-secret-namespace: "helmut4"
  csi.storage.k8s.io/provisioner-secret-name: "smb-creds"
